name: go-linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-lint:
    uses: cloudengio/.github/.github/workflows/go-test-multimod.yml@main
    with:
      runner: |
        [ "self-hosted", "linux", "arm64" ]
      go-versions: |
        [ "1.27.x" ]
      with-lint: true
      with-govuln: true

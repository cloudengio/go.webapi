name: go-macos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    env:
      GOPROXY: "http://gomodproxy.pa.nicolaou.org:3000"

    uses: cloudengio/.github/.github/workflows/go-test-multimod.yml@main
    with:
      runner: |
        [ "self-hosted", "macos", "arm64" ]
      go-versions: |
        [ "1.27.x" ]
